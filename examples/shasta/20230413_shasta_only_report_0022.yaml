RunName: '20230504_shasta_report_0022_simplesolrad'
Description: Historical simulation for period Jan 1 2000 - Sep 30 2022
FacilityName: Shasta Reservoir
SurfaceMethod: simple
SimulationUnits: 'afdegF' #'m3degC' # or 'afdegF'
Location:
  Description: North of Redding, California
  Latitude: 40.7410 # estimated from GIS, middle of lake upstream of dam
  Longitude: -122.4095 #estimated from GIS, middle of lake upstream of dam
Parameters:
  C1: 0.225 #0.25 <--4/28 # 0.15 <--4/26 #0.25 #0.1041 #0.0964      # air temp
  C2: 0.375 #0.375 #<--4/26 #0.22 #0.45 #  0.1562 #0.7817 #0.7542      #solar insolation
  C3: 0.98 # 0.975 #0.9300 <--4/28 #0.5350      # evap
  C4: 0.0525 #0.075 #0.055 <--4/26 # 0.095 #0.085 # 0.06137 #0.0438        # inflow mixing
  C5: 0.004 # 0.0055 # 0.0025 #0.0030 <--4/26 #0.0125 #0.00197 #0.0016  # diffusion
  DiffuseDist: 15.  # distance over which to calculate interlayer diffusion
  DiffuseDistUnits: 'ft'
  CriticalDepth: 35 #31.1263 # 30.3795 #27.8541 #38.
  CriticalDepthUnits: 'ft'
  MeanAlbedo: 0.08 #0.1
  AlbedoAmplitude: 0.025
  ExtinctionCoeff: 0.45
  SeasSolRad: 1.0
  WindMethod: 'w2'
  WindAlpha: 9.45 #8.5
  WindBeta: 0.46 #0.3
  WindGamma: 2.05 #2.0
  WindHeight_m: 10.

Timing:
  #StartDate: '1/1/2011'
  #EndDate: '12/31/2016'
  StartDate: '1/1/2000'
  EndDate: '9/30/2022'
  TimeStepDays: 1.

Simulation Mode:
  Hindcast: True
  SimGateOps: False
  GateChgFreq: 5
  SimReleaseSchedule: False
  CalcEvap: True   #<--- if True, then need to provide dew point time series in inputs
  ReinitMonth: 1
  ReinitDay: 1
  Debug:
    Release: 0
    General: 0

Initial Condition:
  Method: 'from_obs'  # from_obs: will interpolate temperature and assign storage from nearest observation point; must have observation data defined; other option (NOT YET IMPLEMENTED): 'specified': 'storage: 999999, 'tempProfile: [[elev, temp], [elev, temp], etc...]'

Penstocks:
   PenstockElevation: 819.5
   PenstockElevUnits: 'ft'
   PenstockReleaseLimit: 18750.
   PenstockReleaseLimit_Units: 'cfs'

Selective Withdrawal:
  CheckMinHead: True
  3:
    Name: 'UpperGate'
    TopElev: 1045.
    TopElevUnits: 'ft'
    BottomElev: 1000.
    BottomElevUnits: 'ft'
    NumberOfGates: 5
    MinHead: 20.
    MinHeadUnits: 'ft'
    A1GT: 1 #1.8 # 0.25
    B1GT: 1.33 #0.550 # 0.67
    G1GT: 1.3 #1.25 #0.002 #0.001
    NumPointSinks: 3
  2:
    Name: 'MiddleGate'
    TopElev: 945.
    TopElevUnits: 'ft'
    BottomElev: 900.
    BottomElevUnits: 'ft'
    NumberOfGates: 5
    MinHead: 35.
    MinHeadUnits: 'ft'
    A1GT: 1.
    B1GT: 1.33 #1.33 # 1.35 #0.9 #0.6 #0.8
    G1GT: 1.4 #0.002 #0.001
    NumPointSinks: 3
  1:
    Name: 'PressureReliefGate'
    TopElev: 831.
    TopElevUnits: 'ft'
    BottomElev: 804.
